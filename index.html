<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>botão</title>
    <style>
        body{
            height: 100vh;
            align-items: center;
            justify-content: center;
            display: flex;
        }
        button{
            width: 100px;
        }
        h1{
            color: red
        }
    </style>
</head>
<body>
    <div>

        <h1>contadores</h1>
        <button onclick="adicionar()" id="bt1"></button>
        <button onclick="adicionar2()" id="bt2"></button>
    </div>
    <script>
        var numero = 0
        var numero2 = 0

        function adicionar(){
            numero++
            render()
        }

        function adicionar2(){
            numero2++
            render()
        }
        function render(){
            document.querySelector("#bt1").innerText="Total"+numero;
            document.querySelector("#bt2").innerText="Total"+numero2;
        }
        render()
    </script>
</body>
</html>
